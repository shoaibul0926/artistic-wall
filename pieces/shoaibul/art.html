<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My art</title>
<style>
  html, body { margin: 0; height: 100%; background: #bfe6ff; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// Sun rays rotate slowly
let sunAngle = 0;

// Clouds drifting sideways at different heights/speeds
function makeCloud(yFrac, scale, speed, opacity) {
  const puffs = [];
  const n = 5 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    puffs.push({
      dx: (i - n / 2) * 28 * scale + (Math.random() - 0.5) * 10,
      dy: (Math.random() - 0.5) * 12 * scale,
      r: (18 + Math.random() * 16) * scale
    });
  }
  return { x: Math.random(), yFrac, scale, speed, opacity, puffs };
}
const clouds = [
  makeCloud(0.12, 1.1, 0.010, 0.95),
  makeCloud(0.22, 0.8, 0.016, 0.9),
  makeCloud(0.08, 1.4, 0.007, 0.85),
  makeCloud(0.3, 0.6, 0.022, 0.9),
  makeCloud(0.18, 1.0, 0.012, 0.9)
];

// Birds: simple V-shapes gliding across
function makeBird(yFrac, speed, scale) {
  return { x: Math.random(), yFrac, speed, scale, wing: Math.random() * Math.PI * 2 };
}
const birds = [makeBird(0.35, 0.03, 1), makeBird(0.4, 0.025, 0.8), makeBird(0.32, 0.035, 0.7)];

// Grass blades swaying at the bottom
const blades = Array.from({ length: 60 }, () => ({
  x: Math.random(),
  h: 18 + Math.random() * 26,
  phase: Math.random() * Math.PI * 2,
  speed: 0.8 + Math.random() * 0.8
}));

function drawSun(cx, cy, r, t) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(t);
  ctx.fillStyle = 'rgba(255,214,90,0.55)';
  const rays = 12;
  for (let i = 0; i < rays; i++) {
    const a = (i / rays) * Math.PI * 2;
    ctx.save();
    ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(r * 1.05, -6);
    ctx.lineTo(r * 1.55, 0);
    ctx.lineTo(r * 1.05, 6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 1.3);
  grad.addColorStop(0, '#fff7cf');
  grad.addColorStop(0.6, '#ffe17a');
  grad.addColorStop(1, 'rgba(255,214,90,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffd94a';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawCloud(cloud) {
  const cx = cloud.x * W;
  const cy = cloud.yFrac * H;
  ctx.fillStyle = `rgba(255,255,255,${cloud.opacity})`;
  for (const p of cloud.puffs) {
    ctx.beginPath();
    ctx.arc(cx + p.dx, cy + p.dy, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawBird(b, t) {
  const x = b.x * W;
  const y = b.yFrac * H + Math.sin(t * 0.0015 + b.wing) * 6;
  const flap = Math.sin(t * 0.012 + b.wing) * 7 * b.scale;
  ctx.strokeStyle = 'rgba(60,50,40,0.75)';
  ctx.lineWidth = 2 * b.scale;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - 10 * b.scale, y + flap);
  ctx.lineTo(x, y);
  ctx.lineTo(x + 10 * b.scale, y + flap);
  ctx.stroke();
}

function drawGround(t) {
  const groundTop = H * 0.82;
  const g = ctx.createLinearGradient(0, groundTop, 0, H);
  g.addColorStop(0, '#8fd16a');
  g.addColorStop(1, '#5fae48');
  ctx.fillStyle = g;
  ctx.fillRect(0, groundTop, W, H - groundTop);

  ctx.strokeStyle = 'rgba(40,90,30,0.55)';
  ctx.lineWidth = 2;
  for (const b of blades) {
    const bx = b.x * W;
    const sway = Math.sin(t * 0.002 * b.speed + b.phase) * 8;
    ctx.beginPath();
    ctx.moveTo(bx, groundTop + 2);
    ctx.quadraticCurveTo(bx + sway, groundTop - b.h * 0.6, bx + sway * 1.4, groundTop - b.h);
    ctx.stroke();
  }
}

function frame(t) {
  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#6ec3ff');
  sky.addColorStop(0.6, '#bfe6ff');
  sky.addColorStop(1, '#eaf7ff');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  sunAngle += 0.0015;
  drawSun(W * 0.8, H * 0.18, Math.min(W, H) * 0.08, sunAngle);

  for (const cloud of clouds) {
    cloud.x += cloud.speed * 0.001;
    if (cloud.x > 1.3) cloud.x = -0.3;
    drawCloud(cloud);
  }

  for (const b of birds) {
    b.x += b.speed * 0.001;
    if (b.x > 1.1) b.x = -0.1;
    drawBird(b, t);
  }

  drawGround(t);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
